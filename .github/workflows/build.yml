name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-client:
    name: Build SPA client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies and build client
        working-directory: client
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    needs: build-client
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pitchmarket_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pitchmarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          cache: maven

      - name: Run backend tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/pitchmarket_test
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: postgres
        run: ./mvnw -B verify

      - name: Optional SonarCloud analysis
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is not set, skipping SonarCloud analysis."
            exit 0
          fi
          ./mvnw -B sonar:sonar -Dsonar.token="${SONAR_TOKEN}" -DskipTests

  docker-build:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg VITE_API_BASE_URL=/api/v1 -t football-pitch-marketplace:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "Docker Hub secrets are not set, image push is skipped."
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker tag football-pitch-marketplace:${{ github.sha }} "${DOCKERHUB_USERNAME}/football-pitch-marketplace:${{ github.sha }}"
          docker tag football-pitch-marketplace:${{ github.sha }} "${DOCKERHUB_USERNAME}/football-pitch-marketplace:latest"
          docker push "${DOCKERHUB_USERNAME}/football-pitch-marketplace:${{ github.sha }}"
          docker push "${DOCKERHUB_USERNAME}/football-pitch-marketplace:latest"

  deploy:
    name: Deploy and healthcheck
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger PaaS deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, deployment is skipped."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"

      - name: Check deployed application health
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          if [ -z "${APP_HEALTH_URL}" ]; then
            echo "APP_HEALTH_URL is not set, healthcheck is skipped."
            exit 0
          fi
          for attempt in {1..30}; do
            if curl -fsS "${APP_HEALTH_URL}"; then
              echo "Application is healthy."
              exit 0
            fi
            echo "Healthcheck attempt ${attempt} failed, waiting..."
            sleep 10
          done
          echo "Application did not become healthy in time."
          exit 1
