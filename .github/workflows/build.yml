name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build SPA client
        working-directory: client
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build backend
        run: ./mvnw -B -DskipTests clean package

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pitchmarket_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pitchmarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/pitchmarket_test
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: postgres
        run: ./mvnw -B verify

  docker-image:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ghcr.io/saku102007/sem_4_java:latest
            ghcr.io/saku102007/sem_4_java:${{ github.sha }}

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set, skipping manual deploy hook."
            echo "Render Auto Deploy can still deploy the pushed commit."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

  healthcheck:
    name: Healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Wait for startup
        run: sleep 45

      - name: Check /actuator/health with retries
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          HEALTH_URL="$APP_HEALTH_URL"
          if [ -z "$HEALTH_URL" ] && [ -n "$APP_BASE_URL" ]; then
            HEALTH_URL="${APP_BASE_URL%/}/actuator/health"
          fi
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="https://sem-4-java.onrender.com/actuator/health"
          fi

          for i in {1..10}; do
            RESPONSE=$(curl -fsS "$HEALTH_URL" || true)
            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "Healthcheck passed"
              exit 0
            fi
            echo "Healthcheck attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Service is not healthy after retries" >&2
          exit 1
